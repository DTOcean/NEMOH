name: Semantic Release
on: workflow_dispatch

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup | Checkout repository at workflow sha
        uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: intel
      - run: |
          make
          ls bin
        if: runner.os == 'Linux'
      - run: |
          devenv Nemoh.sln
          ls Release
        if: runner.os == 'Windows'
